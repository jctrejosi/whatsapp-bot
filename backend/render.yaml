services:
  - type: web
    name: whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: WHATSAPP_APP_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_PHONE
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: KNOWLEDGE_SERVICE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
