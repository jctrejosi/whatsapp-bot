services:
  - type: web
    name: whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: KNOWLEDGE_SERVICE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_APP_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_PHONE
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_SENDER_EMAIL
        sync: false
      - key: ESCALATION_EMAIL
        sync: false
      - key: MIN_CONFIDENCE
        sync: false
      - key: MAX_NEGATIVE_RESPONSES
        sync: false
      - key: MAX_TOKENS
        sync: false
      - key: MAX_HISTORY_MESSAGES
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
